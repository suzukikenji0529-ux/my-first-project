
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私の初めてのページ</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #eaf5ff;
      color: #24364b;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      color: #1769aa;
      font-size: 40px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .main-image {
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      margin: 20px auto;
    }

    .button {
      display: inline-block;
      background-color: #2878d0;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 24px;
      margin-top: 15px;
    }

    .button:hover {
      background-color: #185ca8;
    }
  </style>
</head>
<body>
  <h1>こんにちは！</h1>
  <p>私の初めてのWebページです。</p>

  <img
    class="main-image"
    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80"
    alt="美しい山と湖の風景">

  <p>これから少しずつ、素敵なホームページにしていきます。</p>

  <a class="button" href="https://github.com/">
    GitHubを見てみる
  </a>
</body>
</html>

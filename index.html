
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私のホームページ</title>

  <style>
    body {
      font-family: sans-serif;
      background-color: #eaf5ff;
      color: #24364b;
      margin: 0;
      text-align: center;
    }

    /* 上部メニュー */
    header {
      background-color: white;
      padding: 18px 12px;
      box-shadow: 0 2px 8px #00000010;
    }

    nav a {
      color: #1769aa;
      text-decoration: none;
      margin: 0 12px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* ページのメイン部分 */
    main {
      padding: 30px 20px;
    }

    h1, h2 {
      color: #1769aa;
    }

    h1 {
      font-size: 40px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .main-image {
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      margin: 20px auto;
    }

    /* 自己紹介カード */
    .profile {
      max-width: 560px;
      margin: 30px auto;
      padding: 24px;
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 4px 12px #00000010;
    }

    .button {
      display: inline-block;
      background-color: #2878d0;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 24px;
      margin-top: 15px;
    }

    .button:hover {
      background-color: #185ca8;
    }

    footer {
      padding: 20px;
      color: #58718a;
      font-size: 14px;
    }

    /* スマートフォンでも見やすくする */
    @media (max-width: 480px) {
      nav a {
        margin: 0 5px;
        font-size: 14px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="#home">ホーム</a>
      <a href="#profile">自己紹介</a>
      <a href="#contact">お問い合わせ</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <h1>こんにちは！</h1>
      <p>私の初めてのWebページです。</p>

      <img
        class="main-image"
        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80"
        alt="美しい山と湖の風景">

      <p>これから少しずつ、素敵なホームページにしていきます。</p>
      <a class="button" href="#profile">自己紹介を見る</a>
    </section>

    <section id="profile" class="profile">
      <h2>自己紹介</h2>
      <p>はじめまして！私のホームページへようこそ。</p>
      <p>このページでは、好きなことや興味のあることを紹介していきます。</p>
    </section>

    <section id="contact">
      <h2>お問い合わせ</h2>
      <p>ご覧いただき、ありがとうございます！</p>
    </section>
  </main>

  <footer>
    © 私のホームページ
  </footer>
</body>
</html>
